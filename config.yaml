# Human-readable reference, not automatically loaded by the current CLI.
# Change runtime settings through scripts/nextims.py arguments.
version: 1.1.0
research_recipe: EXP-V022/r01
model:
  hidden_dim: 768
  num_layers: 14
  num_heads: 24
  node_dim: 34
  edge_dim: 10
  graph_feature_dim: 17
  pooling: mean_add_max
  neutral_loss_fusion_weight: 0.30
  act: true
  refinement_steps: 4
  spectral_residual: true
  spectral_feedback: false
training:
  epochs: 200
  minimum_epochs: 20
  patience: 10
  lr: 0.00005
  optimizer: RAdam
  sam_rho: 0.02
  batch_size: 16
  grad_accumulation: 1
  updates_per_batch: 4
  neutral_loss_weight: 0.05
  stage_cosine_weight: 0.05
  stage_topk_weight: 0.02
  act_loss_weight: 0.001
data:
  max_samples: 0
  val_fraction: 0.1
  test_fraction: 0.1
  split_seed: 42
  num_workers: 0
  graph_cache_max_mib: 64
  min_free_ram_gb: 3
